name: Partner surface

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests and the partner surface check
        run: npm test
        env:
          # Real partner names and IDs, kept out of this public repo.
          PARTNER_SURFACE_FORBIDDEN_TOKENS: ${{ secrets.PARTNER_SURFACE_FORBIDDEN_TOKENS }}
